[project]
name = "bukmacherka"
version = "0.1.0"
description = "Prywatna aplikacja do typowania zakładów piłkarskich na podstawie modelu statystycznego"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic-settings>=2.6",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
bukmacherka = "bukmacherka.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bukmacherka"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
